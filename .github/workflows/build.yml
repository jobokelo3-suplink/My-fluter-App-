name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "Found $ZIP"
          unzip -o "$ZIP" -d temp
          if [ -f "temp/pubspec.yaml" ]; then ROOT="temp"; else INNER=$(ls -1 temp | head -n 1); ROOT="temp/$INNER"; fi
          echo "Root is $ROOT"
          ls -la "$ROOT"
          shopt -s dotglob
          cp -r "$ROOT"/*.
          rm -rf temp "$ZIP"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: Suplink-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
