name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -n 1)
          unzip -o "$ZIP" -d temp
          ROOT=$(find temp -name "pubspec.yaml" | head -n 1 | xargs dirname)
          echo "ROOT is $ROOT"
          cp -a $ROOT/..
          rm -rf temp "$ZIP"
          ls -la
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: Suplink-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
